[build]
dockerfile = "Dockerfile"

[deploy]
healthcheckPath = "/Account/Login"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# REQUIRED: MySQL on Railway
# Steps:
#   1. Add a MySQL plugin/service in the Railway project
#   2. App service Variables:
#        MYSQL_CONNECTION_STRING=Server=<host>;Port=3306;Database=nirvachak_ai;User=<user>;Password=<password>;CharSet=utf8mb4;
#   3. Optional backups folder variable:
#        Backup__Directory=/data/backups
