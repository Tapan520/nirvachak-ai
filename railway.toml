[build]
dockerfile = "Dockerfile"

[deploy]
healthcheckPath = "/Account/Login"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# REQUIRED: Persistent Volume setup (Railway Dashboard)
# Steps:
#   1. Service -> Volumes tab -> Add Volume -> Mount Path: /data
#   2. Service -> Variables tab -> Add: DATABASE_PATH = /data/election.db
